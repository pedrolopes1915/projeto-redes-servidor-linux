# Servidor de Arquivos
[global]
	workgroup = EMPRESA
	server string = Servidor de Arquivos (file01)
	server role = standalone server
	security = user
	map to guest = never

# so escuta na lan e aceita so a lan e o db01 (backup)

	interfaces = 127.0.0.1 10.0.2.10/24
	bind interfaces only = yes
	hosts allow = 127.0.0.1 10.0.2.0/24 10.0.3.10
	hosts deny = all

	server min protocol = SMB2

	log file = /var/log/samba/log.%m

	load printers = no
	printing = bsd
	printcap name = /dev/null
	disable spoolss = yes

[publico]
	path = /compartilhado/publico
	comment = Area publica da empresa
	valid users = @colaboradores
	read only = no
	create mask = 0664
	directory mask = 2775

[projetos]
	path = /compartilhado/projetos
	comment = Projetos de desenvolvimento
	valid users = @devs @diretoria
	write list = @devs
	read only = no
	create mask = 0660
	directory mask = 2770

[backups]
	path = /compartilhado/backups
	comment = Backups corporativos
	valid users = @backup_mgr @diretoria
	write list = @backup_mgr
	read only = no
	create mask = 0660
	directory mask = 2770

