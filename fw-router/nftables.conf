#!/usr/sbin/nft -f
# firewall do fw-router
flush ruleset

#Interfaces
define WAN = "enp0s3"
define DMZ = "enp0s8"
define LAN = "enp0s9"
define DBZ = "enp0s10"

#Servidores
define WEB = 10.0.1.10
define FILE = 10.0.2.10
define DBSRV = 10.0.3.10

table inet filter {

 chain input{
	type filter hook input priority 0; policy drop;
	ct state established, related accept
	ct state invalid drop
	iifname "lo" accept
	ip protocol icmp accept
	iifname { $DMZ, $LAN, $DBZ } udp dport 53 accept #DNS
	iifname { $DMZ, $LAN, $DBZ } tcp dport 53 accept
	iifname $LAN udp dport 67 accept
	iifname $LAN tcp dport 22 accept
	iifname $WAN ip saddr 192.168.100.0/24 tcp dport 22 accept 
}

 chain forward {
	type filter hook forward priority 0; policy drop;
	ct state established, related accept
	ct state invalid drop

	iifname $WAN oifname $DMZ ip daddr $WEB tcp dport { 80, 443 } accept
	iifname $DMZ oifname $DBZ ip saddr $WEB ip daddr $DBSRV tcp dport 5432 accept
	iifname { $WAN, $DMZ } oifname $DBZ counter log prefix "FW-DROP-DB: " drop
	iifname $LAN oifname $DMZ tcp dport { 22, 80, 443 } accept
	iifname $LAN oifname $DBZ tcp dport 22 accept
	iifname $DBZ oifname $LAN ip saddr $DBSRV ip daddr $FILE tcp dport { 139, 445} accept

	iifname $LAN oifname $WAN accept
	iifname { $DMZ, $DBZ } oifname $WAN tcp dport { 80, 443 } accept
}

 chain output {
	type filter hook output priority 0; policy accept;
	}
}

 table ip nat {
  chain prerouting {
	type nat hook prerouting priority dstnat; policy accept;
	iifname $WAN tcp dport { 80, 443 } dnat to $WEB
  }
  chain postrouting {
	type nat hook postrouting priority srcnat; policy accept;
	oifname $WAN masquerade
  }
}

